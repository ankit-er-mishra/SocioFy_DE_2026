    <text x="15" y="318" fill="#f1f5f9" font-size="12">    price</text><text x="170" y="318" fill="#94a3b8" font-size="11">NUMERIC</text>
    <text x="15" y="340" fill="#f1f5f9" font-size="12">    discount</text><text x="170" y="340" fill="#94a3b8" font-size="11">NUMERIC</text>
