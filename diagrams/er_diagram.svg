    <text x="15" y="186" fill="#f1f5f9" font-size="12">    booked_at</text><text x="170" y="186" fill="#94a3b8" font-size="11">TIMESTAMPTZ</text>
    <text x="15" y="208" fill="#f1f5f9" font-size="12">    scheduled_start</text><text x="170" y="208" fill="#94a3b8" font-size="11">TIMESTAMPTZ</text>
    <text x="15" y="230" fill="#f1f5f9" font-size="12">    scheduled_end</text><text x="170" y="230" fill="#94a3b8" font-size="11">TIMESTAMPTZ</text>
    <text x="15" y="252" fill="#f1f5f9" font-size="12">    started_at</text><text x="170" y="252" fill="#94a3b8" font-size="11">TIMESTAMPTZ</text>
    <text x="15" y="274" fill="#f1f5f9" font-size="12">    completed_at</text><text x="170" y="274" fill="#94a3b8" font-size="11">TIMESTAMPTZ</text>
