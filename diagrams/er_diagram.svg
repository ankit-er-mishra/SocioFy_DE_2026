    <text x="15" y="224" fill="#f1f5f9" font-size="12">    kyc_verified</text><text x="150" y="224" fill="#94a3b8" font-size="11">BOOLEAN</text>
    <text x="15" y="248" fill="#f1f5f9" font-size="12">    status</text><text x="150" y="248" fill="#94a3b8" font-size="11">VARCHAR</text>
  </g>

  <!-- 5. PRO SKILLS (X: 350, Y: 600) -->
  <g transform="translate(350, 600)" filter="url(#shadow)">
    <rect width="200" height="130" rx="8" fill="url(#tableGrad)" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 0 h 200 v 32 h -200 z" rx="8" fill="url(#headerGrad)" />
