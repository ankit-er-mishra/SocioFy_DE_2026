    <path d="M 0 0 h 215 v 32 h -215 z" rx="8" fill="url(#headerGrad)" />
    <text x="107" y="21" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">customers</text>
    <text x="15" y="56" fill="#fbbf24" font-weight="bold" font-size="12">PK  customer_id</text><text x="145" y="56" fill="#94a3b8" font-size="11">INT</text>
