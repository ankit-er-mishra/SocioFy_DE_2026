<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="800" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold" letter-spacing="1">URBAN COMPANY HOME SERVICES — DATABASE ER DIAGRAM</text>
  <text x="800" y="72" text-anchor="middle" fill="#94a3b8" font-size="13">Schema: uc · 11 Tables · PostgreSQL 15+ · Author: Chirag Tyagi (Lead)</text>

  <!-- Connection Lines (Paths) -->
  <!-- Cities -> Professionals -->
  <path d="M 260 210 L 320 210" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Cities -> Customers -->
  <path d="M 190 280 L 190 410" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Service Categories -> Services -->
  <path d="M 190 710 L 190 770" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Service Categories -> Pro Skills -->
  <path d="M 260 660 L 370 660" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Professionals -> Pro Skills -->
  <path d="M 440 370 L 440 590" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Professionals -> Pro Availability -->
  <path d="M 550 240 L 630 240" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Professionals -> Bookings -->
  <path d="M 550 310 L 890 540" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Professionals -> Payouts -->
  <path d="M 550 180 L 890 180" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Customers -> Bookings -->
  <path d="M 270 510 L 890 580" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Services -> Bookings -->
  <path d="M 270 870 L 890 690" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Bookings -> Reschedules -->
  <path d="M 1150 560 L 1260 480" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Bookings -> Reviews -->
  <path d="M 1150 670 L 1260 740" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 1. CITIES (X: 50, Y: 130) -->
  <g transform="translate(70, 130)" filter="url(#shadow)">
    <rect width="200" height="140" rx="8" fill="url(#tableGrad)" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 0 h 200 v 32 h -200 z" rx="8" fill="url(#headerGrad)" />
    <text x="100" y="21" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">cities</text>
    <text x="15" y="58" fill="#fbbf24" font-weight="bold" font-size="12">PK  city_id</text><text x="140" y="58" fill="#94a3b8" font-size="11">INT</text>
    <text x="15" y="84" fill="#f1f5f9" font-size="12">    city_name</text><text x="140" y="84" fill="#94a3b8" font-size="11">VARCHAR</text>
    <text x="15" y="110" fill="#f1f5f9" font-size="12">    state</text><text x="140" y="110" fill="#94a3b8" font-size="11">VARCHAR</text>
  </g>

  <!-- 2. SERVICE CATEGORIES (X: 70, Y: 570) -->
