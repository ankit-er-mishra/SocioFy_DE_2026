    <text x="15" y="136" fill="#f1f5f9" font-size="12">    duration_min</text><text x="145" y="136" fill="#94a3b8" font-size="11">INT</text>
    <text x="15" y="162" fill="#f1f5f9" font-size="12">    base_price</text><text x="145" y="162" fill="#94a3b8" font-size="11">NUMERIC</text>
    <text x="15" y="188" fill="#f1f5f9" font-size="12">    is_active</text><text x="145" y="188" fill="#94a3b8" font-size="11">BOOLEAN</text>
  </g>

