    <text x="15" y="80" fill="#fbbf24" font-weight="bold" font-size="12">PK,FK category_id</text><text x="145" y="80" fill="#94a3b8" font-size="11">INT</text>
    <text x="15" y="104" fill="#f1f5f9" font-size="12">      certified_on</text><text x="145" y="104" fill="#94a3b8" font-size="11">DATE</text>
