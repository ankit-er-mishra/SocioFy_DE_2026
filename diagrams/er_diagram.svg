    <text x="15" y="80" fill="#fbbf24" font-weight="bold" font-size="12">PK    work_date</text><text x="145" y="80" fill="#94a3b8" font-size="11">DATE</text>
    <text x="15" y="104" fill="#f1f5f9" font-size="12">      start_time</text><text x="145" y="104" fill="#94a3b8" font-size="11">TIME</text>
    <text x="15" y="128" fill="#f1f5f9" font-size="12">      end_time</text><text x="145" y="128" fill="#94a3b8" font-size="11">TIME</text>
