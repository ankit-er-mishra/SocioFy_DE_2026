    <text x="15" y="58" fill="#fbbf24" font-weight="bold" font-size="12">PK  category_id</text><text x="140" y="58" fill="#94a3b8" font-size="11">INT</text>
    <text x="15" y="84" fill="#f1f5f9" font-size="12">    category_name</text><text x="140" y="84" fill="#94a3b8" font-size="11">VARCHAR</text>
  </g>

  <!-- 3. SERVICES (X: 70, Y: 750) -->
  <g transform="translate(70, 750)" filter="url(#shadow)">
    <rect width="215" height="215" rx="8" fill="url(#tableGrad)" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 0 h 215 v 32 h -215 z" rx="8" fill="url(#headerGrad)" />
    <text x="107" y="21" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">services</text>
    <text x="15" y="58" fill="#fbbf24" font-weight="bold" font-size="12">PK  service_id</text><text x="145" y="58" fill="#94a3b8" font-size="11">INT</text>
    <text x="15" y="84" fill="#38bdf8" font-size="12">FK  category_id</text><text x="145" y="84" fill="#94a3b8" font-size="11">INT</text>
